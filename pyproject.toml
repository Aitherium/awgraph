[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awgraph"
version = "1.4.1"
description = "Semantic code graph for agents — AST + tree-sitter indexing, call graphs, and hybrid search across 40+ languages and documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.25.0",
]

# Optional dependencies
[project.optional-dependencies]
# numpy is highly recommended for efficient vector storage (array('f') fallback otherwise)
numpy = ["numpy>=1.21.0"]

# Development and testing
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0"]

# `awgraph mcp` — serve the graph to any MCP coding agent (Claude Code, Cursor,
# Windsurf, Zed) over stdio. Optional because the library and CLI need nothing
# beyond httpx.
# Pinned to 2.x: the 1.x server API (`Server` with @list_tools/@call_tool
# decorators) was REMOVED in 2.0, so code written for one raises AttributeError
# on the other. `mcp>=1.0` let pip resolve 2.0 against a module written for 1.x
# — it passed tests locally and failed on every clean install.
mcp = ["mcp>=2.0"]

# `multilang` — index the other 40+ languages, and documents, via repowise.
# Optional because the engine is useful on a pure-Python repo with nothing but
# httpx, and because a hard dependency on a third-party parser would make
# `import awgraph` fail wherever it is unavailable. Without it, discovery and
# parsing fall back to Python only and say so in parse_errors rather than
# returning an empty graph that looks like an empty file.
multilang = ["repowise>=0.31.0"]

[project.scripts]
awgraph = "awgraph.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awgraph"
Documentation = "https://github.com/Aitherium/awgraph#readme"
Repository = "https://github.com/Aitherium/awgraph.git"
Issues = "https://github.com/Aitherium/awgraph/issues"

[tool.setuptools]
packages = ["awgraph"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E402", "E741"]  # line length, module-level imports, ambiguous names

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
